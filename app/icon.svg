  <text
    x="16"
    y="24"
    text-anchor="middle"
    font-family="'Arial Black', 'Helvetica Neue', Helvetica, sans-serif"
    font-weight="800"
    font-size="20"
    fill="#126A44"
  >C</text>
</svg>
