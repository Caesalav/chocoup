<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 72" fill="none">
  <!-- El logotipo suelto, para lo que no puede montar el componente: una vista
       previa, un correo, una lámina. No carga Outfit —un SVG suelto no puede
       contar con una fuente web— así que cae en Arial Black, que es la negra
       geométrica de respaldo.

       El «UP» va en un <tspan> dentro del mismo <text>: el color es lo único
       que lo distingue, y el flujo del texto coloca el sufijo sin una `x`
       escrita a mano. -->
  <text
    x="0"
    y="54"
    font-family="'Arial Black', 'Helvetica Neue', Helvetica, sans-serif"
    font-weight="800"
    font-size="48"
    letter-spacing="-2.4"
    fill="#0E1A15"
  >CHOCÓ <tspan fill="#1AB169">UP</tspan></text>
</svg>
